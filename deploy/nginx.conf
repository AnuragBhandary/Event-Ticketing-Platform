# nginx serves the built React app and load-balances /api across two API instances.
worker_processes auto;
events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    access_log    off;
    gzip          on;
    gzip_types    application/json application/javascript text/css;

    upstream api {
        least_conn;  # live seat streams are long-lived: balance by open connections
        server api1:8080 max_fails=1 fail_timeout=2s;
        server api2:8080 max_fails=1 fail_timeout=2s;
        keepalive 32;
    }

    server {
        listen 80;
        root   /usr/share/nginx/html;

        # Server-Sent Events: no buffering, long reads. Regex locations win over the /api/ prefix.
        location ~ ^/api/events/[0-9]+/seats/stream$ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 1h;
        }

        location /api/ {
            proxy_pass            http://api;
            proxy_http_version    1.1;
            proxy_set_header      Connection "";
            proxy_set_header      Host $host;
            proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
            # Retries only idempotent requests (nginx never retries a POST unless told to), so a
            # hold or payment is never sent twice by the proxy.
            proxy_next_upstream   error timeout http_502 http_503;
        }

        location /actuator/ { return 404; }

        # Hashed build assets never change; the HTML always revalidates.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri /index.html;  # client-side routes
            add_header Cache-Control "no-cache";
        }
    }
}
