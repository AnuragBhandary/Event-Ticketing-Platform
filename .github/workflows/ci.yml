name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Integration tests on PostgreSQL (Testcontainers) with an 85% line coverage gate
        run: ./mvnw -B verify

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start nginx, two API instances and PostgreSQL
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright (two buyers, a seat race, payment, an instance restart)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Booking rush (k6, 100 buyers for 20 s) and the double-booking audit
        run: |
          docker run --rm --network event-ticketing-platform_default -v "$PWD/load:/load" \
            -e BASE=http://web -e VUS=100 -e DURATION=20s -e LATENCY=off grafana/k6 run --quiet /load/booking-rush.js
          docker compose exec -T postgres psql -U ticketing -d ticketing -tA -F, -f - < load/audit.sql | tee audit.csv
          awk -F, '{ if ($3 != 0 || $4 != 0 || $1 != $2 || $5 != $6) { print "audit failed"; exit 1 } }' audit.csv
      - if: failure()
        run: docker compose logs --tail 200
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
